[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-booking-agent"
version = "0.1.0"
description = "A conversational restaurant booking agent built with LangGraph and Groq."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain==1.4.2",
    "langgraph==1.2.12",
    "langchain-core==1.6.5",
    "langchain-groq==1.1.3",
    "groq==0.37.1",
    "langfuse==4.15.4",
    "python-dotenv==1.2.3",
]

[project.scripts]
restaurant-booking = "restaurant_booking.cli:main"

[dependency-groups]
dev = [
    "ruff==0.16.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["restaurant_booking*"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]
extend-exclude = ["tools.py", "tmp", "output"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["restaurant_booking", "tests"]
